<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM LQL Soluções | MAJB Sistemas</title>

    <link
      rel="icon"
      href="https://majb.online/shared/logo_LQL.png"
      type="image/png"
    />

    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f8fafc;
      }

      #crm-frame {
        width: 100vw;
        height: calc(100vh + 28px);
        border: none;
        display: block;
        /* TRUQUE DE MESTRE: Puxa o Iframe 28px para cima (valor negativo) */
        margin-top: -28px;
      }

      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-family: "Inter", sans-serif;
        color: #003399;
        font-weight: bold;
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <div id="loading">Carregando o ambiente seguro...</div>

    <iframe id="crm-frame" src="" allowfullscreen> </iframe>

    <script>
      // Roteamento inteligente de ambientes MAJB
      const urlAtual = window.location.hostname;
      const iframe = document.getElementById("crm-frame");

      // Substitua com os Web Apps gerados no Google Apps Script
      const gasProducao = "Meu_Link_Google_Apps_Script_Producao";
      const gasHomologacao = "Meu_Link_Google_Apps_Script_Homologacao";

      if (urlAtual.includes("homologacao")) {
        // Se detectar a palavra homologacao na URL, puxa o sistema de testes
        iframe.src = gasHomologacao;
      } else {
        // Caso contrário, puxa o sistema oficial
        iframe.src = gasProducao;
      }
    </script>
  </body>
</html>
